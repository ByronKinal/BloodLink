  # Microservicio MongoDB (Node.js)
  mongo-service:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: bloodlink-mongo-service
    restart: always
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - MONGODB_URI=mongodb+srv://billyrey3645_db_user:DlYUai23wP2AmNld@cluster0.rmvfkzq.mongodb.net/bloodlink?retryWrites=true&w=majority&appName=Cluster0
      - POSTGRES_SERVICE_URL=http://postgres-service:3007
      - JWT_SECRET=MyVerySecretKeyForJWTTokenAuthenticationWith256Bits!
      - JWT_EXPIRES_IN=30m
      - JWT_REFRESH_EXPIRES_IN=7d
      - JWT_ISSUER=BloodLinkAuthService
      - JWT_AUDIENCE=BloodLinkApp
    depends_on:
      mongo-db:
        condition: service_healthy
      postgres-service:
        condition: service_started
    networks:
      - bloodlink-net

  # Aplicación Web Frontend (React)
  ms-react:
    build:
      context: ./ms-react
      dockerfile: Dockerfile
    container_name: bloodlink-ms-react
    restart: always
    ports:
